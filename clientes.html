<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base de Clientes & SLAs - RCA 61</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    
    <header class="main-header">
      <div class="header-title">
        <h1>Base de Clientes & SLAs - RCA 61</h1>
        <p>Consulta unificada da carteira completa e prazos de entrega por cidade</p>
      </div>

      <div class="header-controls">
        <a href="index.html" class="btn-upload" style="text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
          <i data-lucide="arrow-left" style="width:16px;height:16px;"></i> Voltar ao Dashboard
        </a>
        <div class="status-badge active" id="statusBadge">
          <span class="status-dot"></span>
          <span id="contadorClientes">Carregando base...</span>
        </div>
      </div>
    </header>

    <!-- Tabela Geral de Clientes e SLAs -->
    <section class="table-card" style="margin-top: 10px;">
      <div class="card-header space-between">
        <h3>Lista de Clientes, Cidades & Prazos de SLA</h3>
        <input type="text" id="searchClientGlobal" placeholder="Pesquisar por cliente, cidade ou código..." class="table-search" style="width: 300px;">
      </div>
      <div class="table-wrapper" style="max-height: 600px;">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Cliente / Razão Social</th>
              <th>Fantasia</th>
              <th>Cidade / UF</th>
              <th>SLA de Entrega</th>
              <th style="text-align: center;">Ações</th>
            </tr>
          </thead>
          <tbody id="tbClientesSLA">
            <tr>
              <td colspan="6" class="empty-row">Carregando clientes...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <script>
    if (typeof lucide !== 'undefined') lucide.createIcons();

    const tabelaSLAPorCidade = {
      "SÃO PAULO": "D+1",
      "SAO PAULO": "D+1",
      "GUARULHOS": "D+2",
      "CAMPINAS": "D+2",
      "SANTOS": "D+2",
      "JUNDIAI": "D+2",
      "JUNDIAÍ": "D+2",
      "SOROCABA": "D+2",
      "SÃO JOSÉ DOS CAMPOS": "D+2",
      "SAO JOSE DOS CAMPOS": "D+2",
      "RIBEIRAO PRETO": "D+3",
      "RIBEIRÃO PRETO": "D+3",
      "BAURU": "D+3",
      "MARILIA": "D+3",
      "MARÍLIA": "D+3",
      "SAO CARLOS": "D+3",
      "SÃO CARLOS": "D+3",
      "PRESIDENTE PRUDENTE": "D+4",
      "SUMARÉ": "D+2",
      "SUMARE": "D+2",
      "PAULÍNIA": "D+2",
      "PAULINIA": "D+2",
      "PIRACICABA": "D+3",
      "LIMEIRA": "D+3",
      "AMERICANA": "D+2"
    };

    let baseClientesGlobal = [];

    // Dados "vivos" (faturamento e inatividade) salvos pelo index.html quando
    // as planilhas de Vendas/Carteira são carregadas por lá. Se o usuário
    // ainda não carregou nada no Dashboard, isso fica nulo e as informações
    // extras simplesmente não aparecem no modal de detalhes.
    let dadosVivosGlobal = null;

    function normalizarNome(str) {
      return String(str || '')
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .toUpperCase()
        .replace(/[^A-Z0-9 ]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function carregarDadosVivos() {
      try {
        const raw = localStorage.getItem('rca61_dadosVivos');
        dadosVivosGlobal = raw ? JSON.parse(raw) : null;
      } catch (e) {
        dadosVivosGlobal = null;
      }
    }

    function buscarDadosVivosCliente(c) {
      if (!dadosVivosGlobal || !dadosVivosGlobal.clientes) return null;
      const candidatos = [normalizarNome(c.cliente), normalizarNome(c.fantasia)].filter(Boolean);
      for (const chave of candidatos) {
        if (dadosVivosGlobal.clientes[chave]) return dadosVivosGlobal.clientes[chave];
      }
      const chavesSalvas = Object.keys(dadosVivosGlobal.clientes);
      for (const k of chavesSalvas) {
        if (candidatos.some(ca => k.includes(ca) || ca.includes(k))) {
          return dadosVivosGlobal.clientes[k];
        }
      }
      return null;
    }

    function formatarSLA(c) {
      if (c.slaDias !== undefined && c.slaDias !== null && c.slaDias !== '') {
        return `D+${c.slaDias}`;
      }
      if (c.sla) {
        const match = String(c.sla).match(/D\+\d+/i);
        if (match) return match[0].toUpperCase();
      }
      const cidadeUpper = String(c.cidade || '').toUpperCase().trim();
      return tabelaSLAPorCidade[cidadeUpper] || "D+3";
    }

    // Carrega os dados automaticamente do arquivo JSON fixo na pasta assim que a página abre
    document.addEventListener("DOMContentLoaded", () => {
      carregarDadosVivos();
      fetch('clientes.json')
        .then(response => {
          if (!response.ok) throw new Error('Não foi possível carregar o arquivo de clientes.');
          return response.json();
        })
        .then(data => {
          baseClientesGlobal = data;
          renderizarTabelaClientes(baseClientesGlobal);
          document.getElementById('contadorClientes').innerText = `Base Completa (${baseClientesGlobal.length} Clientes)`;
        })
        .catch(error => {
          console.error(error);
          document.getElementById('tbClientesSLA').innerHTML = '<tr><td colspan="6" class="empty-row" style="color: #ef4444;">Erro ao carregar a base fixa de clientes. Verifique o arquivo clientes.json.</td></tr>';
          document.getElementById('contadorClientes').innerText = 'Erro na base';
        });
    });

    function renderizarTabelaClientes(dados) {
      const tbody = document.getElementById('tbClientesSLA');
      tbody.innerHTML = '';

      if (dados.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty-row">Nenhum cliente encontrado.</td></tr>';
        return;
      }

      const fragment = document.createDocumentFragment();

      dados.forEach((c) => {
        // Mostra apenas a quantidade de dias (ex: "D+1"), sem o texto entre parênteses.
        let sla = formatarSLA(c);

        const tr = document.createElement('tr');
        tr.className = 'clickable-row';
        tr.innerHTML = `
          <td>${c.codigo}</td>
          <td><strong>${c.cliente}</strong></td>
          <td>${c.fantasia || '-'}</td>
          <td>${c.cidade} - ${c.uf}</td>
          <td style="color: var(--accent-green, #10b981); font-weight: 600;">${sla}</td>
          <td style="text-align: center;">
            <button class="btn-upload" style="padding: 4px 10px; font-size: 0.75rem; margin: 0 auto;">Ver Detalhes</button>
          </td>
        `;

        tr.querySelector('button').addEventListener('click', () => abrirModalCliente(c, sla));
        fragment.appendChild(tr);
      });

      tbody.appendChild(fragment);
    }

    document.getElementById('searchClientGlobal').addEventListener('input', function(e) {
      const termo = e.target.value.toLowerCase().trim();
      const filtrados = baseClientesGlobal.filter(c => {
        return String(c.cliente).toLowerCase().includes(termo) ||
               String(c.cidade).toLowerCase().includes(termo) ||
               String(c.codigo).toLowerCase().includes(termo) ||
               String(c.fantasia).toLowerCase().includes(termo);
      });
      renderizarTabelaClientes(filtrados);
    });

    function abrirModalCliente(c, sla) {
      let modalContainer = document.getElementById('customClientModal');
      if (!modalContainer) {
        modalContainer = document.createElement('div');
        modalContainer.id = 'customClientModal';
        modalContainer.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background-color:rgba(11,15,25,0.8);backdrop-filter:blur(6px);z-index:99999;display:flex;align-items:center;justify-content:center;';
        document.body.appendChild(modalContainer);
      }

      const valorFormatado = typeof c.valor === 'number' 
        ? c.valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }) 
        : c.valor;

      // Só aparece depois que as planilhas forem carregadas no Dashboard (index.html)
      const dadosVivos = buscarDadosVivosCliente(c);
      let blocoVivo = '';
      if (dadosVivos) {
        const faturamentoVivo = typeof dadosVivos.faturamento === 'number'
          ? dadosVivos.faturamento.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })
          : '-';
        const dias = dadosVivos.diasInativo;
        const temDias = typeof dias === 'number' && !isNaN(dias);
        const corAtividade = temDias && dias >= 60 ? '#ef4444' : '#10b981';
        const textoAtividade = temDias ? `${dias} dias sem comprar` : 'Sem dados de inatividade';

        blocoVivo = `
            <div style="background: #0f172a; padding: 12px; border-radius: 8px; border-left: 4px solid #3b82f6;">
              <span style="color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; display: block;">Faturamento (Planilha do Dashboard)</span>
              <strong style="color: #3b82f6; font-size: 1rem;">${faturamentoVivo}</strong>
            </div>
            <div style="background: #0f172a; padding: 12px; border-radius: 8px; border-left: 4px solid ${corAtividade};">
              <span style="color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; display: block;">Atividade de Compra</span>
              <strong style="color: ${corAtividade}; font-size: 1rem;">${textoAtividade}</strong>
              ${dadosVivos.ultimaFatura ? `<span style="display:block; margin-top:4px; font-size:0.75rem; color:#94a3b8;">Última fatura (planilha): ${dadosVivos.ultimaFatura}</span>` : ''}
            </div>`;
      } else {
        blocoVivo = `
            <div style="background: #0f172a; padding: 10px; border-radius: 8px; border: 1px dashed #334155; grid-column: 1 / -1;">
              <span style="color: #64748b; font-size: 0.75rem;">💡 Carregue as planilhas no Dashboard (index.html) para ver aqui o faturamento atualizado e a atividade de compra deste cliente.</span>
            </div>`;
      }

      modalContainer.innerHTML = `
        <div style="background: #1e293b; border: 1px solid #334155; border-radius: 12px; width: 90%; max-width: 480px; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); font-family: sans-serif; color: #f8fafc;">
          <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 12px; margin-bottom: 16px;">
            <h3 style="margin: 0; font-size: 1.1rem; color: #6366f1; display: flex; align-items: center; gap: 8px;">🏢 Detalhes do Cliente (RCA 61)</h3>
            <button onclick="fecharModalCliente()" style="background: transparent; border: none; color: #94a3b8; font-size: 1.5rem; cursor: pointer;">&times;</button>
          </div>
          <div style="display: flex; flex-direction: column; gap: 12px; font-size: 0.95rem;">
            <div style="background: #0f172a; padding: 12px; border-radius: 8px; border-left: 4px solid #6366f1;">
              <span style="color: #94a3b8; font-size: 0.8rem; text-transform: uppercase; display: block;">Cliente</span>
              <strong style="font-size: 1.05rem; color: #ffffff;">${c.cliente}</strong>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
              <div style="background: #0f172a; padding: 10px; border-radius: 8px;"><span style="color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; display: block;">CNPJ</span><strong style="color: #38bdf8; font-size: 0.85rem;">${c.cnpj}</strong></div>
              <div style="background: #0f172a; padding: 10px; border-radius: 8px;"><span style="color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; display: block;">Cidade / UF</span><strong style="color: #e2e8f0;">${c.cidade} - ${c.uf}</strong></div>
              <div style="background: #0f172a; padding: 10px; border-radius: 8px;"><span style="color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; display: block;">Telefone</span><strong style="color: #e2e8f0;">${c.telefone && c.telefone !== '-' ? c.telefone : (c.celular && c.celular !== '-' ? c.celular : '-')}</strong></div>
              <div style="background: #0f172a; padding: 10px; border-radius: 8px;"><span style="color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; display: block;">E-mail</span><strong style="color: #e2e8f0; font-size: 0.85rem; word-break: break-all;">${c.email || '-'}</strong></div>
              <div style="background: #0f172a; padding: 10px; border-radius: 8px;"><span style="color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; display: block;">Faturamento Total</span><strong style="color: #10b981;">${valorFormatado}</strong></div>
              <div style="background: #0f172a; padding: 10px; border-radius: 8px;"><span style="color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; display: block;">Última Venda</span><strong style="color: #e2e8f0;">${c.ultimaVenda}</strong></div>
              ${blocoVivo}
            </div>
            <div style="background: #0f172a; padding: 12px; border-radius: 8px; border-left: 4px solid #10b981;">
              <span style="color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; display: block;">SLA Oficial da Cidade</span>
              <strong style="color: #10b981; font-size: 1rem;">${sla}</strong>
              ${c.slaSituacao && c.slaSituacao !== '-' ? `<span style="display:block; margin-top:4px; font-size:0.75rem; color:#94a3b8;">${c.slaSituacao}</span>` : ''}
            </div>
          </div>
          <div style="margin-top: 20px; text-align: right;"><button onclick="fecharModalCliente()" style="background: #6366f1; color: white; border: none; padding: 8px 18px; border-radius: 6px; font-weight: 600; cursor: pointer;">Fechar</button></div>
        </div>
      `;
      modalContainer.style.display = 'flex';
    }

    function fecharModalCliente() {
      const modalContainer = document.getElementById('customClientModal');
      if (modalContainer) modalContainer.style.display = 'none';
    }
  </script>
</body>
</html>
